CONFIG_KERNEL_BIN_NAME="wolfboot_openamp"
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_OPENAMP=y
CONFIG_IPM=y
CONFIG_IPM_MBOX=y
CONFIG_MBOX_NXP_IMX_MU=y
CONFIG_MBOX_INIT_PRIORITY=0
CONFIG_OPENAMP_WITH_DCACHE=y

# The resource table Linux reads belongs to wolfBoot, not to this payload, so
# the subsystem's own table is deliberately NOT built - it would describe vrings
# that nobody honours. See src/main.c.
CONFIG_OPENAMP_RSC_TABLE=n

CONFIG_CLOCK_CONTROL=y
CONFIG_ARM_SCMI=y

# No M7 UART is routed on this carrier; logs go to a RAM buffer read with
# memtool, and the interesting output is relayed over RPMsg instead.
CONFIG_UART_CONSOLE=n
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3

# The payload reads two regions outside its own linked SRAM: wolfBoot's console
# ring at 0x80F00000 and the RPMsg vrings at 0x88000000. Zephyr's MPU config
# does not cover them, and the access faults - which shows up as the payload
# announcing its RPMsg channel and then resetting in a ~15 ms loop, with the
# RAM console reading back all zeros because .bss is wiped on every reset.
# wolfBoot itself runs this target with NO_MPU=1, so match that.
