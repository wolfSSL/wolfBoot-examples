CONFIG_KERNEL_BIN_NAME="wolfboot_openamp"

CONFIG_OPENAMP=y
CONFIG_IPM=y
CONFIG_IPM_MBOX=y
CONFIG_MBOX_NXP_IMX_MU=y
CONFIG_MBOX_INIT_PRIORITY=0
CONFIG_OPENAMP_WITH_DCACHE=y

# The resource table Linux reads belongs to wolfBoot, not to this payload, so
# the subsystem's own table is deliberately NOT built - it would describe vrings
# that nobody honours. See src/main.c.
CONFIG_OPENAMP_RSC_TABLE=n

CONFIG_CLOCK_CONTROL=y
CONFIG_ARM_SCMI=y

# No M7 UART is routed on this carrier, so the console is a printk hook in
# main.c that appends to the shared ring wolfBoot already writes (and that the
# demo already reads). That puts the Zephyr banner, driver init and every LOG
# line in the same stream as wolfBoot's own verified-boot output, on one core's
# timeline. Zephyr's RAM console is off deliberately: it installs a competing
# printk hook and writes to a second buffer nothing reads.
CONFIG_UART_CONSOLE=n
CONFIG_RAM_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
# Debug level. It adds about thirty lines over a boot - IRQ registration,
# per-thread stack placement, the scheduler settling - which is detail worth
# showing on a demo of what the second core is doing, and nowhere near enough
# to wrap the 64 KiB ring.
CONFIG_LOG_DEFAULT_LEVEL=4
# ...except the kernel itself. At debug it logs a scheduler line every couple
# of ticks forever, which says nothing about this demo and would eventually
# wrap wolfBoot's verified-boot output out of the ring. What is worth seeing
# from startup - version, clocks, the vring contract, time to main - the
# payload prints itself.
CONFIG_KERNEL_LOG_LEVEL_INF=y

# wolfCrypt on the M7, so this core can run the same post-quantum algorithms
# the A55 cluster benchmarks. ML-DSA-87 in particular needs far more stack and
# heap than a plain RPMsg payload: the key and signature alone are several KiB.
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_MLKEM=y
CONFIG_WOLFSSL_MLDSA=y
# Thumb-2 assembly for SHA-2/SHA-3 and friends. ML-KEM and ML-DSA are dominated
# by SHAKE, so this is the single biggest lever on the numbers below, and the
# A55 side is built with its own architecture's assembly for the same reason.
CONFIG_WOLFCRYPT_ARMASM=y
CONFIG_WOLFCRYPT_ARMASM_THUMB2=y
# The benchmark reports MiB/s and ms as floats. Without this Zephyr's printf
# prints "*float*" for every number, which is exactly the part worth reading.
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=65536
CONFIG_HEAP_MEM_POOL_SIZE=262144
# wolfCrypt's Zephyr port seeds from sys_rand_get(), and this core has no
# entropy peripheral - the TRNG on this SoC sits behind ELE, which only the
# A55 side reaches. A software PRNG is therefore the only option here. It is
# adequate for a timing benchmark, where the numbers do not depend on the
# quality of the input, and is NOT an entropy source: no key generated on this
# core should be treated as secret.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_XOSHIRO_RANDOM_GENERATOR=y
CONFIG_IPM_LOG_LEVEL_DBG=y
CONFIG_MBOX_LOG_LEVEL_DBG=y

# The payload reads two regions outside its own linked SRAM: wolfBoot's console
# ring at 0x80F00000 and the RPMsg vrings at 0x88000000. Zephyr's MPU config
# does not cover them, and the access faults - which shows up as the payload
# announcing its RPMsg channel and then resetting in a ~15 ms loop, with the
# RAM console reading back all zeros because .bss is wiped on every reset.
# wolfBoot itself runs this target with NO_MPU=1, so match that.
